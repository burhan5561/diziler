name: Yayin akisini guncelle

on:
  schedule:
    - cron: "0 4 * * *"    # Her gün 07:00 (Türkiye saati)
    - cron: "0 13 * * *"   # Her gün 16:00 (Türkiye saati)
  workflow_dispatch:        # Elle çalıştırma düğmesi

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri kur
        run: pip install requests beautifulsoup4

      - name: Yayin akisini topla
        run: python guncelle.py

      - name: Sonuclari kaydet
        run: |
          git config user.name "dizi-botu"
          git config user.email "dizi-botu@users.noreply.github.com"
          git add data.json gecmis.json
          git diff --staged --quiet || git commit -m "Yayin akisi guncellendi"
          git push
